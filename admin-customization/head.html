<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style id="oylgCustomAdminBrand">
:root {
    --custom-font: 'Nunito', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --custom-heading-font: 'Quicksand', 'Nunito', 'Noto Sans Arabic', sans-serif;
    --custom-primary: #c84b31;
    --custom-primary-hover: #ad3c24;
    --custom-primary-soft: rgba(200, 75, 49, .14);
    --custom-sidebar-bg: #141416;
    --custom-sidebar-hover: rgba(255, 255, 255, .08);
    --custom-page-bg: #f6f5f2;
    --custom-border: #e5e2dc;
    --custom-heading: #171717;
    --custom-muted: #66635c;
    --custom-radius: 14px;
    --custom-radius-sm: 10px;
    --custom-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 2px 6px rgba(16, 24, 40, .05);
}

body,
.btn, .form-control, .custom-select, .input-group-text,
.dropdown-menu, .modal, .tooltip, .popover, .toast,
.nav-sidebar .nav-link, .table {
    font-family: var(--custom-font) !important;
    font-weight: 500;
}

h1, h2, h3, h4, h5, h6,
.content-header h1,
.card-title,
.brand-link,
.main-sidebar .brand-text,
.small-box h3 {
    font-family: var(--custom-heading-font) !important;
    font-weight: 700 !important;
}

code, pre, .oylg-num {
    font-family: var(--custom-font) !important;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

code {
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(200, 75, 49, .09);
    color: #a63820;
    font-size: .88em;
}

.content-header h1 {
    font-size: 1.5rem;
    letter-spacing: -.01em;
}

body:not(.dark-mode) .content-header h1 {
    color: var(--custom-heading);
}

body:not(.dark-mode) .content-wrapper {
    background-color: var(--custom-page-bg);
}

body:not(.dark-mode):not([data-theme-color]) .main-header.navbar {
    background-color: #ffffff;
    border-bottom: 1px solid var(--custom-border);
    box-shadow: none;
}

body:not(.dark-mode):not([data-theme-color]) .main-sidebar,
body:not(.dark-mode):not([data-theme-color]) .main-sidebar .brand-link {
    background-color: var(--custom-sidebar-bg) !important;
}

.main-sidebar .brand-link {
    border-bottom-color: rgba(255, 255, 255, .08) !important;
}

.nav-sidebar .nav-link {
    border-radius: var(--custom-radius-sm);
    font-size: .93rem;
    font-weight: 600;
}

body:not(.dark-mode):not([data-theme-color]) .nav-sidebar .nav-link:not(.active):hover {

}

body:not([data-theme-color]) .sidebar-dark-primary .nav-treeview > .nav-item > .nav-link.active {

    box-shadow: 0 4px 12px rgba(200, 75, 49, .28);
}

.card, .small-box {
    border-radius: var(--custom-radius);
}

.card {
    border: 1px solid var(--custom-border);
    box-shadow: var(--custom-shadow);
}

body.dark-mode .card {
    border-color: var(--ezy-dark-border);
}

.card > .card-header:first-child {
    border-start-start-radius: calc(var(--custom-radius) - 1px);
    border-start-end-radius: calc(var(--custom-radius) - 1px);
}

.small-box {
    box-shadow: var(--custom-shadow);
}

.small-box > .small-box-footer {
    border-end-start-radius: var(--custom-radius);
    border-end-end-radius: var(--custom-radius);
    font-weight: 600;
}

.btn {
    border-radius: var(--custom-radius-sm);
    font-weight: 600;
}

body:not([data-theme-color]) .btn-primary {
    background-color: var(--custom-primary);
    border-color: var(--custom-primary);
}

body:not([data-theme-color]) .btn-primary:hover,
body:not([data-theme-color]) .btn-primary:focus {
    background-color: var(--custom-primary-hover);
    border-color: var(--custom-primary-hover);
}

body:not([data-theme-color]) .btn-outline-primary {
    color: var(--custom-primary);
    border-color: var(--custom-primary);
}

body:not([data-theme-color]) .btn-outline-primary:hover {
    color: #ffffff;
    background-color: var(--custom-primary);
}

body:not([data-theme-color]) .card-primary.card-outline {
    border-top-color: var(--custom-primary);
}

body:not([data-theme-color]) .page-item.active .page-link,
body:not([data-theme-color]) .custom-control-input:checked ~ .custom-control-label::before,
body:not([data-theme-color]) .bg-primary,
body:not([data-theme-color]) .badge-primary {
    background-color: var(--custom-primary) !important;
    border-color: var(--custom-primary) !important;
}

body:not([data-theme-color]):not(.dark-mode) .text-primary {
    color: var(--custom-primary) !important;
}

.form-control,
.custom-select,
.input-group-text {
    border-radius: var(--custom-radius-sm);
}

.form-control:focus,
.custom-select:focus {
    border-color: var(--custom-primary);
    box-shadow: 0 0 0 3px var(--custom-primary-soft);
}

body:not(.dark-mode) .table thead th {
    color: #525252;
    font-weight: 700;
    font-size: .84rem;
    border-bottom-width: 1px;
}

.badge {
    border-radius: 999px;
    font-weight: 600;
    padding: .36em .7em;
}

body:not(.dark-mode) .main-footer {
    color: var(--custom-muted);
    border-top-color: var(--custom-border);
    font-size: .85rem;
}

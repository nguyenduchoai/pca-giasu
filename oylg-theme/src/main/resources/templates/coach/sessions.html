<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{ezytheme}">
<body>
<div layout:fragment="content" class="stack-20">

    <div class="row-between">
        <h1 class="page-title">Sổ đầu bài nhanh (30 giây)</h1>
        <div class="row-inline">
            <button type="button" class="btn btn--sm btn--secondary" onclick="oylg.fillSampleNote('dlp')">Thử tự ẩn SĐT</button>
            <button type="button" class="btn btn--sm btn--outline" style="color:var(--neg);" onclick="oylg.fillSampleNote('m14')">Thử cảnh báo tâm lý</button>
        </div>
    </div>

    <div class="card">
        <form onsubmit="oylg.submitLessonLogForm(event)" class="grid-2">
            <div class="stack-12">
                <div class="grid-2" style="gap:10px;">
                    <div>
                        <label class="field-label">Học sinh</label>
                        <select id="logStudentId" class="select">
                            <option th:each="st : ${students}" th:value="${st.id}" th:text="${st.fullName + ' (Lớp ' + st.currentGrade + ')'}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">Bài học hôm nay</label>
                        <input id="logUnitCode" class="input" value="7 Hằng đẳng thức Lớp 8" />
                    </div>
                </div>

                <div class="grid-3" style="gap:10px;">
                    <div>
                        <label class="field-label">Mức độ nắm bài</label>
                        <select id="logUnderstanding" class="select">
                            <option value="MASTERED" selected="selected">Nắm vững</option>
                            <option value="PARTIAL">Hiểu một phần</option>
                            <option value="NOT_YET">Cần kèm lại</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">Tinh thần</label>
                        <select id="logMood" class="select">
                            <option value="Tập trung cao" selected="selected">Tập trung cao</option>
                            <option value="Bình thường">Bình thường</option>
                            <option value="Mệt mỏi">Mệt mỏi</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">Điểm tập trung</label>
                        <input id="logFocus" type="number" min="1" max="5" class="input" value="5" />
                    </div>
                </div>

                <div>
                    <label class="field-label">Nhận xét gửi Phụ huynh &amp; Bài về nhà</label>
                    <textarea id="lessonRawNotes" class="textarea" oninput="oylg.previewLessonDlp()">Con nắm chắc hằng đẳng thức và làm đúng 5/5 câu cuối buổi. Về nhà hoàn thành bài trang 24.</textarea>
                </div>

                <div>
                    <label class="field-label">Ghi chú riêng gửi Cố vấn (Phụ huynh không thấy)</label>
                    <input id="logInternalNotes" class="input" value="Đã bù xong phần Lớp 8, buổi tới sang Căn bậc hai Lớp 9." />
                </div>
            </div>

            <div class="stack-16" style="display:flex;flex-direction:column;justify-content:space-between;">
                <div class="stack-12">
                    <div class="card card--compact stack-8" style="background:var(--bg-page);">
                        <div class="row-between">
                            <span class="stat-label">Nội dung hiển thị bên Phụ huynh</span>
                            <span id="lessonDlpMeta" class="tag tag--pos">Hợp lệ</span>
                        </div>
                        <p id="lessonSanitizedPreview" style="font-size:13.5px;"></p>
                    </div>

                    <div id="lessonM14Alert" class="card card--compact tag--neg" style="display:none;height:auto;white-space:normal;">
                        <div style="font-weight:700;">CẢNH BÁO AN TOÀN TÂM LÝ</div>
                        <div style="font-size:12.5px;margin-top:4px;">Tự động báo ngay cho Cố vấn Tâm lý · Tổng đài Bảo vệ Trẻ em: <strong>111</strong> · Y tế: <strong>115</strong>.</div>
                    </div>
                </div>

                <button type="submit" class="btn btn--accent btn--lg btn--full">Lưu &amp; Gửi sang Cổng Phụ huynh</button>
            </div>
        </form>
    </div>

    <details class="oylg-drawer">
        <summary th:text="${'Các buổi học đã ghi nhận gần đây (' + completedLogs.size() + ')'}">Lịch sử sổ đầu bài</summary>
        <div class="oylg-drawer__body stack-8">
            <div th:each="log : ${completedLogs}" class="card card--compact stack-4" style="background:var(--bg-page);">
                <div class="row-between">
                    <strong th:text="${log.studentName + ' · ' + log.subjectLabel}"></strong>
                    <span class="tag tag--pos"
                          th:text="${log.understandingLevel == 'MASTERED' ? 'Nắm vững' : (log.understandingLevel == 'PARTIAL' ? 'Hiểu một phần' : 'Cần kèm lại')}"></span>
                </div>
                <div class="secondary" style="font-size:13px;" th:text="${log.sanitizedParentSummary}"></div>
            </div>
        </div>
    </details>

</div>
</body>
</html>

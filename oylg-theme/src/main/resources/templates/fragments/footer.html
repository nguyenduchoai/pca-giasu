<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="oylg-footer">
    <div class="oylg-container">
        <div class="oylg-footer__grid">
            <div class="stack-12">
                <div class="row-inline">
                    <span class="oylg-brand__mark" style="background:#c84b31;color:#fff;">OY</span>
                    <span style="font-size:16px;font-weight:500;color:#efe9de;">All Your Life (OYLG)</span>
                </div>
                <p style="font-size:13px;line-height:22px;color:#aaa398;max-width:400px;"
                   th:text="${footerFragments != null ? footerFragments.get('company_intro') : ''}">
                </p>
                <p class="mono" style="font-size:12px;color:#efe9de;"
                   th:text="${footerFragments != null ? footerFragments.get('contact_information') : ''}">
                </p>
            </div>

            <div>
                <div style="font-size:12px;font-weight:500;color:#efe9de;margin-bottom:10px;">Chương trình học</div>
                <a href="/#mo-hinh-3-tang">Phương pháp 3 bước</a>
                <a href="/#bang-gia-goi-hoc">Gói học &amp; Học phí</a>
                <a href="/#hoi-dong-chuyen-gia">Đội ngũ chuyên gia</a>
                <a href="/#noi-tru-an-toan">Bán trú &amp; Đón trả</a>
            </div>

            <div>
                <div style="font-size:12px;font-weight:500;color:#efe9de;margin-bottom:10px;">Cổng thành viên</div>
                <a href="/parent" onclick="event.preventDefault();oylg.switchRoleAndGo('0905123489','/parent')">Cổng Phụ huynh</a>
                <a href="/student" onclick="event.preventDefault();oylg.switchRoleAndGo('0905000089','/student')">Cổng Học sinh</a>
                <a href="/coach" onclick="event.preventDefault();oylg.switchRoleAndGo('0905888002','/coach')">Cổng Giáo viên</a>
                <a href="http://localhost:9090/oylg/dashboard">Trang Quản trị</a>
            </div>
        </div>

        <div class="row-between" style="padding-top:24px;font-size:12px;color:#8a847a;">
            <span th:text="${'© ' + (currentYear != null ? currentYear : 2026) + ' Công ty TNHH All Your Life'}">© 2026 Công ty TNHH All Your Life</span>
            <span>Cam kết hoàn học phí 100% số buổi chưa học trong 14 ngày đầu</span>
        </div>
    </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="oylg-topbar">
    <div class="oylg-topbar__inner">
        <a href="/" class="oylg-brand">
            <span class="oylg-brand__mark">OY</span>
            <div>
                <div class="oylg-brand__name">All Your Life</div>
                <div class="oylg-brand__sub"
                     th:text="${activeNav == 'parent' ? 'Cổng Phụ huynh đồng hành' : (activeNav == 'student' ? 'Không gian Học sinh' : 'Hướng nghiệp &amp; Bù lỗ hổng gốc')}">
                    Hướng nghiệp &amp; Bù lỗ hổng gốc
                </div>
            </div>
        </a>

        <!-- Public navigation -->
        <nav th:if="${shellMode == 'public'}" class="oylg-nav" aria-label="Điều hướng chính">
            <a th:each="item : ${mainMenu}"
               th:href="${item.get('url')}"
               th:text="${item.get('title')}"
               class="oylg-nav__link">Mục</a>
        </nav>

        <!-- Member switcher (Parent only sees child selector; Student does not see other students' wallets) -->
        <div th:if="${shellMode == 'member' and activeNav == 'parent' and students != null}" class="row-inline hide-mobile">
            <span class="muted" style="font-size:12px;">Hồ sơ con:</span>
            <select class="select" style="height:34px;width:auto;font-size:13px;"
                    onchange="location.href='/parent?studentId=' + this.value">
                <option th:each="st : ${students}"
                        th:value="${st.id}"
                        th:selected="${activeStudent != null and st.id == activeStudent.id}"
                        th:text="${st.fullName + ' · Lớp ' + st.currentGrade + ' (Ví ' + st.sessionCreditsRemaining + ' buổi)'}">
                </option>
            </select>
        </div>

        <div class="oylg-topbar__actions">
            <button th:if="${shellMode == 'public'}"
                    type="button"
                    class="oylg-quiet-link"
                    onclick="oylg.openModal('oylgRoleModal')">
                Đăng nhập
            </button>
            <a th:if="${shellMode == 'public'}"
               href="/#bang-gia-goi-hoc"
               class="btn btn--accent">
                Đăng ký lộ trình
            </a>

            <button th:if="${shellMode == 'member' and activeNav == 'parent'}"
                    type="button"
                    class="btn btn--accent btn--sm"
                    onclick="oylg.openCheckout('PKG-T3-TUTOR-6M', 'Gói Đồng Hành Chuyên Gia Bộ Môn (6 tháng · 48 buổi)', 13980000, 48)">
                Nạp thêm gói học
            </button>

            <button th:if="${shellMode == 'member'}"
                    type="button"
                    class="btn btn--secondary btn--sm"
                    onclick="oylg.openModal('oylgRoleModal')">
                <span class="mono" style="font-size:11px;" th:text="${personaInitials != null ? personaInitials : 'PH'}">PH</span>
                <span th:text="${personaName != null ? personaName : 'Tài khoản'}">Tài khoản</span>
            </button>
        </div>
    </div>
</header>
</body>
</html>

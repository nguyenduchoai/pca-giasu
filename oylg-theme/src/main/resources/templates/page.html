<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:ezy="http://www.ezyplatform.com/thymeleaf/layout">
<head th:remove="tag">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" ezy:vhref="/css/style.css" />
    <style>
        body {
            background-color: #FFFDF9;
            color: #141413;
            font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .font-editorial {
            font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
            letter-spacing: -0.02em;
        }
        .double-bezel-shell {
            background: rgba(26, 46, 38, 0.04);
            border: 1px solid rgba(26, 46, 38, 0.10);
            border-radius: 28px;
            padding: 6px;
        }
        .double-bezel-core {
            background: #FFFFFF;
            border: 1px solid rgba(26, 46, 38, 0.08);
            border-radius: 22px;
        }
        .btn-oylg-primary {
            background-color: #E85D3F !important;
            background-image: linear-gradient(135deg, #FF6B4A 0%, #D94E30 100%) !important;
            color: #FFFFFF !important;
        }
        .btn-oylg-primary:hover {
            background-color: #D94E30 !important;
            background-image: linear-gradient(135deg, #E85D3F 0%, #C23E20 100%) !important;
            color: #FFFFFF !important;
        }
        .btn-oylg-emerald {
            background-color: #059669 !important;
            background-image: linear-gradient(135deg, #059669 0%, #0D9488 100%) !important;
            color: #FFFFFF !important;
        }
        .btn-oylg-indigo {
            background-color: #4F46E5 !important;
            background-image: linear-gradient(135deg, #4F46E5 0%, #2563EB 100%) !important;
            color: #FFFFFF !important;
        }
        .btn-oylg-amber {
            background-color: #D97706 !important;
            background-image: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%) !important;
            color: #FFFFFF !important;
        }
        .surface-oylg-dark {
            background-color: #112A22 !important;
            background-image: linear-gradient(135deg, #0F5132 0%, #112A22 55%, #1E1B4B 100%) !important;
            color: #FFFFFF !important;
        }
    </style>
</head>
<body th:remove="tag">
    <th:block th:replace="~{fragments/header :: header}" />
    <main class="min-h-screen">
        <div layout:fragment="content"></div>
    </main>
    <th:block th:replace="~{fragments/footer :: footer}" />
</body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{ezytheme}">
<body>
<div layout:fragment="content" class="stack-20">

    <div class="row-between">
        <h1 class="page-title">Phụ huynh đăng ký tư vấn</h1>
        <span class="tag tag--accent" th:text="${leads.size() + ' hồ sơ'}">3 hồ sơ</span>
    </div>

    <div class="card stack-12">
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Phụ huynh &amp; Học sinh</th>
                    <th>Nhu cầu</th>
                    <th>Giới thiệu</th>
                    <th class="text-right">Dự kiến</th>
                    <th>Trạng thái</th>
                    <th class="text-right">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ld : ${leads}">
                    <td>
                        <div style="font-weight:700;" th:text="${ld.parentName + ' · ' + ld.phone}"></div>
                        <div class="muted" style="font-size:12px;" th:text="${ld.studentName + ' (Lớp ' + ld.grade + ') · ' + ld.province}"></div>
                    </td>
                    <td th:text="${ld.serviceInterest}"></td>
                    <td th:text="${(ld.referralCode != null and !ld.referralCode.isEmpty()) ? ld.referralCode : 'Tự đăng ký'}"></td>
                    <td class="text-right" style="font-weight:700;" th:text="${#numbers.formatInteger(ld.quotedAmountVnd, 3, 'POINT') + 'đ'}"></td>
                    <td>
                        <span class="tag"
                              th:classappend="${ld.stage == 'PAID' ? 'tag--pos' : (ld.stage == 'SCHEDULED' ? 'tag--warn' : '')}"
                              th:text="${ld.stage == 'PAID' ? 'Đã đóng phí' : (ld.stage == 'SCHEDULED' ? 'Đã hẹn lịch' : 'Mới đăng ký')}"></span>
                    </td>
                    <td class="text-right">
                        <button th:if="${ld.stage != 'PAID'}"
                                type="button"
                                class="btn btn--sm btn--accent"
                                th:attr="onclick='oylg.advanceLead(' + ${ld.id} + ')'"
                                th:text="${ld.stage == 'NEW' ? 'Hẹn lịch' : 'Thu học phí'}">
                        </button>
                        <span th:if="${ld.stage == 'PAID'}" class="muted" style="font-size:12px;">Hoàn tất</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <details class="oylg-drawer">
        <summary>Công cụ tính hoa hồng Cộng tác viên &amp; Trưởng nhóm</summary>
        <div class="oylg-drawer__body">
            <div class="split-asym">
                <div class="grid-2" style="gap:12px;">
                    <div>
                        <label class="field-label">Người tư vấn</label>
                        <select id="commRole" class="select" onchange="oylg.recalcCommission()">
                            <option value="REP_AND_LEADER" selected="selected">CTV (10% + Trưởng nhóm 5%)</option>
                            <option value="LEADER_DIRECT">Trưởng nhóm tự bán (15%)</option>
                            <option value="CARE_UPSELL">Đơn gia hạn (0%)</option>
                        </select>
                    </div>
                    <div>
                        <label class="field-label">Đợt đầu thu (VNĐ)</label>
                        <input id="commFirstPay" type="number" class="input" value="4500000" oninput="oylg.recalcCommission()" />
                    </div>
                    <div>
                        <label class="field-label">Giá trị 6 tháng (VNĐ)</label>
                        <input id="commSixMonth" type="number" class="input" value="13980000" oninput="oylg.recalcCommission()" />
                    </div>
                    <div>
                        <label class="field-label">Số kỳ đã thu: <strong id="commPeriodsLabel">6 / 6 kỳ</strong></label>
                        <input id="commPeriods" type="range" min="1" max="6" value="6" style="width:100%;margin-top:10px;" oninput="oylg.recalcCommission()" />
                    </div>
                </div>

                <div class="grid-2" style="gap:10px;">
                    <div class="card card--compact" style="background:var(--bg-page);">
                        <div class="stat-label">Doanh thu tính thưởng</div>
                        <div id="commOutDthh" class="stat-figure" style="font-size:19px;">13.980.000đ</div>
                    </div>
                    <div class="card card--compact" style="background:var(--bg-page);">
                        <div class="stat-label">Tối đa (15%)</div>
                        <div id="commOutEntitled" class="stat-figure" style="font-size:19px;">2.097.000đ</div>
                    </div>
                    <div class="card card--compact" style="background:var(--pos-soft);">
                        <div class="stat-label">Được nhận</div>
                        <div id="commOutUnlocked" class="stat-figure" style="font-size:19px;color:var(--pos);">2.097.000đ</div>
                    </div>
                    <div class="card card--compact" style="background:var(--neg-soft);">
                        <div class="stat-label">Chưa đủ kỳ</div>
                        <div id="commOutClawback" class="stat-figure" style="font-size:19px;color:var(--neg);">0đ</div>
                    </div>
                </div>
            </div>
        </div>
    </details>

</div>
</body>
</html>
